<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="X榜单 · 中文区 X（Twitter）创作者数据榜单。发帖、评论、涨粉、曝光，每天自动更新。"
    />
    <meta property="og:title" content="X榜单 · 中文区创作者数据榜单" />
    <meta property="og:description" content="发帖、评论、涨粉、曝光四个维度，每天自动更新。" />
    <meta property="og:type" content="website" />
    <title>X榜单 · 中文区创作者数据榜单</title>
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('xb-theme')
          const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

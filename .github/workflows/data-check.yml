name: Validate data

on:
  push:
    paths:
      - 'public/data/**'
      - 'scraper/**'
      - 'scripts/**'
      - 'config/**'
  pull_request:
    paths:
      - 'public/data/**'
      - 'scraper/**'
      - 'scripts/**'
      - 'config/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON dataset
        run: python scripts/validate_data.py
